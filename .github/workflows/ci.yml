name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgbm1 libgl1 libnss3 libxcomposite1 libxcursor1 \
            libxdamage1 libxi6 libxkbcommon0 libxkbfile1 libxrandr2 \
            libxrender1 libxtst6
      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.3.1 torchvision==0.18.1
      - name: Install project and test dependencies
        run: python -m pip install -e '.[gui,api,highlight]' pytest ruff bandit
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
      - name: Security checks
        run: bandit -c pyproject.toml -r pix2tex
